# Publishes a tagged release to the WordPress.org SVN repository.
# Needs repository secrets SVN_USERNAME / SVN_PASSWORD (the WordPress.org
# account that owns the plugin) once the plugin is approved. Assets in
# .wordpress-org/ (banners, icons, screenshots) are synced to /assets.
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "v*"
  # Manual run for approval day: v1.0.0 was tagged before the WordPress.org
  # listing existed, and a tag push only fires once. After approval, set the
  # WPORG_DEPLOY_ENABLED variable + SVN secrets, then run this workflow by hand.
  # `version` is required on a manual run: the deploy action otherwise takes the
  # version from the git ref, which on a dispatch is a BRANCH (refs/heads/main)
  # and would create an SVN tag of that name. On a tag push it stays empty and
  # the action falls back to the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must match Stable tag in readme.txt and Version in the plugin header"
        required: true
        default: "1.0.0"
jobs:
  deploy:
    # Gated on a repository VARIABLE so tagging a GitHub release before the
    # WordPress.org listing exists is a no-op instead of a failed SVN login.
    # After approval: Settings → Secrets and variables → Actions → Variables →
    # WPORG_DEPLOY_ENABLED = true, plus the SVN_USERNAME / SVN_PASSWORD secrets.
    if: ${{ vars.WPORG_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: budgetpixel-ai-images
          VERSION: ${{ github.event.inputs.version }}
